<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoneCap Clone - إعدادات الحل التلقائي</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 16px; width: 320px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 16px; margin: 0 0 12px; color: #38bdf8; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  label { font-size: 13px; color: #94a3b8; }
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #475569; border-radius: 24px; transition: .2s; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #22d3ee; }
  input:checked + .slider:before { transform: translateX(20px); }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #38bdf8; color: #000; font-weight: 700; cursor: pointer; font-size: 14px; }
  button:hover { background: #7dd3fc; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 12px; color: #94a3b8; margin-top: 10px; min-height: 18px; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }
  .api { margin-top: 14px; }
  .api input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1120; color: #e2e8f0; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<h1>NoneCap Clone</h1>
<div class="row">
  <label>تفعيل الحل التلقائي</label>
  <div class="toggle"><input type="checkbox" id="enabled"><div class="slider"></div></div>
</div>
<div class="row">
  <label>الوضع الذاتي الكامل (/auto)</label>
  <div class="toggle"><input type="checkbox" id="autoMode"><div class="slider"></div></div>
</div>
<div class="row api">
  <label>رابط السيرفر</label>
  <input type="text" id="apiBase" placeholder="http://localhost:8000">
</div>
<button id="solveBtn">حل التحدي الآن</button>
<div class="status" id="status">جاري التحميل...</div>
<script src="popup.js"></script>
</body>
</html>
