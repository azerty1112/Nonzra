[project]
name = "nonecap-browser"
version = "0.6.0"
description = "Playwright browser integration for NoneCap Clone"
requires-python = ">=3.9"
dependencies = ["playwright>=1.40.0", "httpx>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["playwright_solver.py", "selenium_solver.py"]
