services:
  nonecap-api:
    build: .
    image: nonecap/clone:latest
    container_name: nonecap-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      # حدّد مفاتيح CORS صريحة عند الاستخدام من لوحة خارجية: "*" أو قائمة مفصولة بفواصل
      - NONECAP_CORS_ORIGINS=${NONECAP_CORS_ORIGINS:-}
      - NONECAP_ENCRYPTION_KEY=${NONECAP_ENCRYPTION_KEY:-}
      - DATABASE_URL=sqlite:////app/data/nonecap_clone.db
    volumes:
      - nonecap-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nonecap-data:
