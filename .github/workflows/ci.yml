name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # التحليل الثابت والأمان
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bandit security scan
        uses: pip-audit/action@v0.4.0
        with:
          requirements: api_server/requirements.txt

      - name: Run bandit code scan
        run: |
          pip install bandit
          bandit -r api_server/ solver_engine/ cli/ browser/ intelligence/ || true

  # الاختبارات والتحليل الثابت
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api_server/requirements.txt
          pip install pytest pytest-asyncio mypy httpx

      - name: Run mypy static analysis
        run: mypy solver_engine/ api_server/ clients/python/nonecap/ cli/ browser/ intelligence/

      - name: Run tests
        run: pytest tests/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  # بناء صورة Docker
  build-docker:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nonecap/clone:latest
          load: true

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.9.0
        with:
          image: 'nonecap/clone:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # النشر (فقط عند الدفع إلى main)
  deploy:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: nonecap/clone:latest
