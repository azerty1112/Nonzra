[project]
name = "nonecap-clone"
version = "0.6.0"
description = "Open source self-hosted CAPTCHA solver framework (NoneCap clone)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3",
    "httpx>=0.24",
    "pydantic>=2.0",
]
client = [
    "httpx>=0.24",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_generics = false
