name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (light, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart pillow numpy \
            opencv-python-headless pytesseract httpx pydantic sqlalchemy cryptography \
            slowapi prometheus-client pytest pytest-asyncio ruff

      - name: Ruff (lint)
        run: ruff check solver_engine api_server intelligence cli tests || true

      - name: Run tests
        run: pytest tests/ -v

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api_server/requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=solver_engine --cov=api_server --cov=intelligence --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nonecap/clone:ci
          load: true

      - name: Smoke test container
        run: |
          docker run -d --name nonecap-ci -p 8000:8000 nonecap/clone:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/capabilities
          curl -fsS http://localhost:8000/metrics | head -5
          docker logs nonecap-ci
          docker rm -f nonecap-ci
