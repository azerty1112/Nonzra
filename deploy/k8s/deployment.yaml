apiVersion: apps/v1
kind: Deployment
metadata:
  name: nonecap-api
  labels:
    app: nonecap-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nonecap-api
  template:
    metadata:
      labels:
        app: nonecap-api
    spec:
      containers:
      - name: nonecap-api
        image: nonecap/clone:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://nonecap:nonecap@postgres:5432/nonecap"
        - name: NONECAP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: nonecap-secrets
              key: encryption-key
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nonecap-api
  labels:
    app: nonecap-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: nonecap-api
---
apiVersion: v1
kind: Secret
metadata:
  name: nonecap-secrets
type: Opaque
stringData:
  encryption-key: "غير את هذا المفتاح إلى قيمة قوية وعشوائية في الإنتاج"
