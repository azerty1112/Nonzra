# إعداد نشر Fly.io — خادم كامل مجاني بلا حدود
# الاستخدام:
#   fly launch --now --copy-config
#   fly deploy
app = "nonzra"
primary_region = "cdg"          # باريس — قريب من تونس/شمال إفريقيا
kill_signal = "SIGINT"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  NONECAP_ENV = "production"
  NONECAP_UNLIMITED = "1"            # بلا حدود وبلا مفتاح إلزامي
  NONECAP_CONCURRENCY = "4"
  NONECAP_MAX_CONCURRENCY = "16"
  NONECAP_JOB_TTL_SECONDS = "3600"
  DATABASE_URL = "sqlite:////app/data/nonecap_clone.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"     # توفير الموارد عند عدم الاستخدام
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "nonzra_data"
  destination = "/app/data"
