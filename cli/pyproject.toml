[project]
name = "nonecap-cli"
version = "0.6.0"
description = "CLI for NoneCap Clone CAPTCHA solver"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0"]

[project.scripts]
nonecap = "nonecap_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["nonecap_cli.py", "__main__.py"]
